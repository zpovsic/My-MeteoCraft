[package]
name = "meteocraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop app showing live weather data from the Ljubljana Koseze weather station"
repository = "https://github.com/zpovsic/My-MeteoCraft"
license = "MIT OR Apache-2.0"

[[bin]]
name = "meteocraft"
path = "apps/main.rs"

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["http", "image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
scraper = "0.29.0"
ureq = "3.5.0"

[target."cfg(windows)".dependencies]
ab_glyph = "0.2.32"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
